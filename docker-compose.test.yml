services:
  postgres:
    image: postgres:16-alpine
    container_name: altrix-postgres-test
    environment:
      POSTGRES_DB: altrix_test
      POSTGRES_USER: altrix
      POSTGRES_PASSWORD: altrix
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altrix -d altrix_test"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
